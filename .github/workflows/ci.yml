# SOLUTE-MANAGED: Windows and Linux compatibility checks.
name: Cross-platform tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Codex CLI
        run: npm install --global @openai/codex
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run doctor
        run: python scripts/solute.py doctor
