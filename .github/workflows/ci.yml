# SOLUTE-MANAGED: Windows and Linux compatibility checks.
name: Cross-platform tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build native hook
        run: cargo build --release --manifest-path native-hook/Cargo.toml
      - name: Install Codex CLI
        run: npm install --global @openai/codex
      - name: Run tests
        run: python -m unittest discover -s tests -v
        env:
          SOLUTE_RUNTIME_BINARY: ${{ runner.os == 'Windows' && format('{0}/native-hook/target/release/solute-hook.exe', github.workspace) || format('{0}/native-hook/target/release/solute-hook', github.workspace) }}
      - name: Run Rust tests
        run: cargo test --manifest-path native-hook/Cargo.toml
      - name: Run doctor
        run: python scripts/solute.py doctor
        env:
          SOLUTE_RUNTIME_BINARY: ${{ runner.os == 'Windows' && format('{0}/native-hook/target/release/solute-hook.exe', github.workspace) || format('{0}/native-hook/target/release/solute-hook', github.workspace) }}
